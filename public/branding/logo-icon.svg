<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2245"/>
      <stop offset="1" stop-color="#060a18"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="steps" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"/>
  <!-- open "C" arc: the coaching circle -->
  <path d="M 361 137 A 150 150 0 1 0 361 375" fill="none"
        stroke="url(#arc)" stroke-width="44" stroke-linecap="round"/>
  <!-- ascending steps to the specialist register -->
  <rect x="216" y="296" width="52" height="52" rx="12" fill="url(#steps)" opacity="0.55"/>
  <rect x="252" y="232" width="52" height="52" rx="12" fill="url(#steps)" opacity="0.8"/>
  <rect x="288" y="168" width="52" height="52" rx="12" fill="url(#steps)"/>
  <!-- star at the summit: the specialist register -->
  <path d="M 384 118 l 10.5 21.5 23.5 3.5 -17 16.5 4 23.5 -21 -11 -21 11 4 -23.5 -17 -16.5 23.5 -3.5 z"
        fill="#fbbf24"/>
</svg>
