<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-label="CESR Coach">
  <defs>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="steps" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6ecff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(10,10) scale(0.2344)">
    <path d="M 361 137 A 150 150 0 1 0 361 375" fill="none"
          stroke="url(#arc)" stroke-width="44" stroke-linecap="round"/>
    <rect x="216" y="296" width="52" height="52" rx="12" fill="url(#steps)" opacity="0.55"/>
    <rect x="252" y="232" width="52" height="52" rx="12" fill="url(#steps)" opacity="0.8"/>
    <rect x="288" y="168" width="52" height="52" rx="12" fill="url(#steps)"/>
    <path d="M 384 118 l 10.5 21.5 23.5 3.5 -17 16.5 4 23.5 -21 -11 -21 11 4 -23.5 -17 -16.5 23.5 -3.5 z"
          fill="#fbbf24"/>
  </g>
  <!-- wordmark -->
  <text x="150" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="700" fill="url(#word)" letter-spacing="1">CESR Coach</text>
  <text x="152" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" fill="rgba(230,236,255,0.55)" letter-spacing="3">TO THE SPECIALIST REGISTER</text>
</svg>
