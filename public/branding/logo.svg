<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-label="CESR Coach">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4c4c4"/>
    </linearGradient>
  </defs>
  <!-- mark: the open C, open toward the goal, with the route running to it -->
  <g transform="translate(10 10) scale(1.875)">
    <path d="M49.4 45 A22 22 0 1 1 49.4 19" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <line x1="21" y1="32" x2="41" y2="32" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 5"/>
    <circle cx="50.5" cy="32" r="5" fill="#ffffff"/>
  </g>
  <!-- wordmark -->
  <text x="150" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="700" fill="url(#word)" letter-spacing="1">CESR Coach</text>
  <text x="152" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" fill="rgba(255,255,255,0.5)" letter-spacing="3">TO THE SPECIALIST REGISTER</text>
</svg>
