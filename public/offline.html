<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · CESR Coach</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(120% 90% at 50% 0%, #6b7078 0%, #43474d 48%, #2b2e33 100%);
      color: #f2f2f2;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 33, 38, 0.7);
      border: 1px solid rgba(208, 211, 216, 0.36);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      backdrop-filter: blur(24px);
    }
    img { height: 64px; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: rgba(245, 246, 247, 0.8); font-size: 0.9rem; margin: 0 0 20px; }
    button {
      background: linear-gradient(120deg, #fcfcfd, #dfe1e5 45%, #b3b7bd);
      color: #14161a;
      border: none;
      border-radius: 999px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/branding/logo-icon.svg" alt="CESR Coach" />
    <h1>You're offline</h1>
    <p>CESR Coach needs a connection to load your videos, documents and bookings.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
