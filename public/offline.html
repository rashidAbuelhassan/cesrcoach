<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · CESR Coach</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(120% 90% at 50% 0%, #0b1735 0%, #060a18 48%, #04060e 100%);
      color: #e6ecff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      backdrop-filter: blur(24px);
    }
    img { height: 64px; margin-bottom: 16px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: rgba(230, 236, 255, 0.6); font-size: 0.9rem; margin: 0 0 20px; }
    button {
      background: linear-gradient(120deg, #67e8f9, #22d3ee);
      color: #04121a;
      border: none;
      border-radius: 999px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/branding/logo-icon.svg" alt="CESR Coach" />
    <h1>You're offline</h1>
    <p>CESR Coach needs a connection to load your videos, documents and bookings.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
